<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Service Reliability Platform (Mini)</title>
</head>
<body style="font-family:Arial;">
  <h2>Service Reliability Platform (Mini)</h2>
  <p>This dashboard reads metrics from <code>/api/summary</code>.</p>

  <button onclick="sendReq()">Send Request</button>
  <button onclick="refresh()">Refresh</button>

  <pre id="out">Loading…</pre>

<script>
async function sendReq() {
  await fetch("/api/request", { method: "POST" });
  refresh();
}

async function refresh() {
  const res = await fetch("/api/summary");
  const data = await res.json();
  document.getElementById("out").innerText = JSON.stringify(data, null, 2);
}
refresh();
</script>
</body>
</html>
